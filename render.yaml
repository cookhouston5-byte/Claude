# Desired Render settings. The live services are not blueprint-synced.
# Do not apply this file as a Blueprint. Set the Kalmvue static site by hand
# or with the Render API. Leave the FixFocus web service as it is.

services:
  - type: web
    name: kalmvue
    runtime: static
    branch: main
    buildCommand: "echo Kalmvue files are already in kalmvue/"
    staticPublishPath: ./kalmvue
    headers:
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
  - type: web
    name: fixfocus
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: fixfocus
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: YOUTUBE_API_KEY
        sync: false
